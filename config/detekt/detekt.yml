# Se aplica sobre la configuración por defecto de detekt (constitución §5).
complexity:
  CyclomaticComplexMethod:
    threshold: 15
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Repositorios y pantallas con muchas rutas: el umbral por defecto (11) queda corto.
    thresholdInFiles: 16
    thresholdInClasses: 16
    thresholdInInterfaces: 16
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Constantes en SCREAMING_SNAKE_CASE (HTTP_UNAUTHORIZED, PASSWORD_MIN, …).
    constantPattern: '[_A-Z][_A-Z0-9]*'
style:
  MagicNumber:
    excludes: ['**/core/designsystem/**', '**/test/**', '**/androidTest/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
