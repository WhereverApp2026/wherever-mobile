# Se aplica sobre la configuración por defecto de detekt (constitución §5).
complexity:
  CyclomaticComplexMethod:
    threshold: 15
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Kotlin: constantes en MAYÚSCULAS_CON_GUION_BAJO (const val MAX_LENGTH).
    constantPattern: '[A-Z][_A-Za-z0-9]*'
style:
  MagicNumber:
    excludes: ['**/core/designsystem/**', '**/test/**', '**/androidTest/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    # Las cláusulas de guarda (`?: return`, `if (...) return`) no cuentan.
    excludeGuardClauses: true
