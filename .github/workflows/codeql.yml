name: codeql

# SAST semántico de GitHub para Kotlin y Java (evaluación, mejora 2; specs/nv-39 §2.7).
# Corre en cada PR a main, en cada push a main y una vez por semana (consultas nuevas sobre código viejo).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # Compilación sin caché para que CodeQL vea todo el código Kotlin.
      # Sin daemon de Gradle y con Kotlin en el mismo proceso: si quedan vivos (hasta 4 GB de Gradle
      # más el daemon de Kotlin), «Analizar» se queda sin memoria y el runner se cae (2026-11-27).
      - name: Compilar
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process assembleDebug

      - name: Liberar memoria
        run: |
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          free -h

      - name: Analizar
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:java-kotlin"
