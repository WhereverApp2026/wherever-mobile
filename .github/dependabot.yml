# AGENTS.md §6: Dependabot activo. Solo abre PR de versiones; no despliega nada.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Espera 7 días tras cada versión nueva antes de proponerla (versiones recién publicadas = más riesgo).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Espera 7 días tras cada versión nueva antes de proponerla (versiones recién publicadas = más riesgo).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
